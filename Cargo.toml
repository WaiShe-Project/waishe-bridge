[package]
name = "waishe-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WaiShe-Project/waishe-bridge"
description = "WaiShe Bridge: local peripheral manager with sandboxed drivers, tray and local API"
publish = false

[dependencies]
waishe-driver-types = { git = "https://github.com/WaiShe-Project/waishe-driver-sdk", branch = "main" }
waishe-driver-host = { git = "https://github.com/WaiShe-Project/waishe-driver-sdk", branch = "main" }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
semver = "1.0.28"
sha2 = "0.11.1"
getrandom = "0.4.3"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
rust-embed = "8.14.0"
mime_guess = "2.0.5"
open = "5.4.5"
tray-icon = { version = "0.26.1", default-features = false }
winit = "0.30.13"
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
